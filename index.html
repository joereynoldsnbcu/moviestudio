<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Movie Studio Hero – Universal Games</title>
<style>
:root{--bg:#0b0d14;--panel:#151a27;--panel2:#1c2233;--panel3:#232a3f;--line:#2a3149;--ink:#eef1f8;--dim:#9aa3bd;--gold:#f5c451;--gold2:#e0a52b;--teal:#3dd6c6;--rose:#ff6b81;--green:#4fd88a;--red:#ff5c6c;--orange:#ff9f43;--blue:#5aa9ff;--violet:#a78bfa;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Inter",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);min-height:100vh;
background:radial-gradient(1100px 600px at 15% -10%,#1f2746 0,transparent 60%),radial-gradient(900px 500px at 110% 0%,#2b1c3d 0,transparent 55%),var(--bg)}
h1,h2,h3,.logo,.tab,.btn,.stat b{font-family:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:1100px;margin:0 auto;padding:14px}
/* header */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#ff8a5b);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px #f5c45140}
.logo .t1{font-size:20px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.logo .t2{font-size:11px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;min-width:86px}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat b{font-size:16px;font-weight:600}
.stat.money b{color:var(--gold)}
/* scene */
.sceneWrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 40px #0008;background:#000}
#scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:320/170}
.sceneBar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);padding:8px 12px;margin-top:-1px}
#ticker{color:var(--dim);font-size:14px;flex:1;min-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker b{color:var(--gold)}
.speed{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:10px}
.speed button{background:none;border:0;padding:4px 10px;border-radius:8px;font-size:13px;color:var(--dim);font-weight:600}
.speed button.on{background:var(--panel3);color:var(--gold)}
/* tabs */
.tabs{display:flex;gap:4px;margin:14px 0 10px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;overflow-x:auto}
.tab{background:none;border:0;color:var(--dim);padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{background:var(--panel3);color:var(--gold)}
/* generic */
.card{background:linear-gradient(180deg,#1a2030,#151a27);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dim{color:var(--dim)}.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.bl{color:var(--blue)}.tl{color:var(--teal)}
.small{font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;background:linear-gradient(180deg,#f8d16b,var(--gold2));color:#1d1400;box-shadow:0 4px 14px #f5c45130;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--panel3);color:#677090;box-shadow:none;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.teal{background:linear-gradient(180deg,#5ee6d8,#25b3a5);color:#00201d}
.btn.danger{background:linear-gradient(180deg,#ff7d8a,#e2475a);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:10px;background:#0c0f18;border-radius:6px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:6px;transition:width .4s}
.bar.gold i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--dim)}
.vb{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px}
.vb.SMASH{background:var(--gold);color:#241800}.vb.HIT{background:var(--green);color:#002312}.vb.SOLID{background:var(--blue);color:#001a33}
.vb.FLOP{background:var(--orange);color:#2a1300}.vb.BOMB{background:var(--red);color:#fff}.vb.RUN{background:var(--violet);color:#14093a}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #ffffff0d;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff06}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv span:nth-child(odd){color:var(--dim)}
.upg{display:flex;flex-direction:column;gap:6px}
.upg .ic{font-size:24px}
.lv{display:flex;gap:3px}.lv i{width:16px;height:6px;border-radius:3px;background:var(--panel3)}.lv i.on{background:var(--gold)}
#log .li{padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
#log .li .d{color:var(--dim);font-size:12px;margin-right:6px}
/* modal */
.modal{position:fixed;inset:0;background:#05070cd0;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:900px;width:100%;max-height:94vh;overflow:auto;padding:20px;box-shadow:0 30px 80px #000c}
.mbox h2{font-size:22px;margin-bottom:4px}
.hidden{display:none!important}
/* wizard */
.wz{display:grid;grid-template-columns:1fr 250px;gap:16px}
.stepper{display:flex;gap:4px;margin:6px 0 14px;flex-wrap:wrap}
.stepper i{height:5px;flex:1;min-width:10px;border-radius:3px;background:var(--panel3)}
.stepper i.done{background:var(--teal)}.stepper i.cur{background:var(--gold)}
.opt{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;transition:border-color .15s,transform .08s,background .15s;font-size:14px;line-height:1.45}
.opt:hover{border-color:var(--gold);background:var(--panel3)}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px #f5c45155 inset}
.opt:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.opt .ot{display:block;font-weight:700;font-size:15px;margin-bottom:3px;color:var(--ink)}
.opt .oc{display:block;margin-top:6px;color:var(--gold);font-weight:600}
.opt .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sum{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;align-self:start;position:sticky;top:0}
.sum .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #ffffff10}
.sum .tot{font-weight:700;font-size:15px;margin-top:6px;display:flex;justify-content:space-between}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;background:#0c0f18;color:var(--ink);border:1px solid var(--line);border-radius:10px;width:100%;outline:none}
input[type=text]:focus{border-color:var(--gold)}
/* film detail */
.fd{display:grid;grid-template-columns:180px 1fr;gap:18px}
.poster{aspect-ratio:2/3;border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 10px 30px #0009;border:1px solid #ffffff20}
.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#ffffff35,transparent 45%),linear-gradient(180deg,transparent 40%,#000c)}
.poster b{position:relative;font-family:"Bahnschrift","Segoe UI",sans-serif;font-size:19px;line-height:1.1;text-transform:uppercase;letter-spacing:.5px}
.poster small{position:relative;color:#ffffffb0;font-size:11px;margin-top:4px}
.poster .aw{position:absolute;top:8px;right:8px;font-size:22px;z-index:1}
.scores{display:flex;gap:14px;margin:10px 0}
.sc{display:flex;align-items:center;gap:8px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;position:relative}
.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:1}
.chart{display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 0;border-bottom:1px solid var(--line)}
.chart div{flex:1;background:linear-gradient(180deg,var(--teal),#1f8f84);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.rev{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.rev .rh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.rev .rh b{font-size:13px}.rev .rs{font-weight:700}
/* toast */
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,460px);pointer-events:none}
.toast{background:#1e2538f2;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px #000a;animation:tin .25s ease-out}
.toast.g{border-left-color:var(--green)}.toast.r{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:17px;color:var(--green);text-shadow:0 2px 6px #000;animation:fl 1.5s forwards;z-index:40;font-family:"Bahnschrift","Segoe UI",sans-serif}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}
/* title */
.ts{text-align:center;padding:10px 6px}
.ts h1{font-size:40px;line-height:1.05;letter-spacing:1px;background:linear-gradient(180deg,#fff2c4,var(--gold) 55%,#e0862b);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.ts .by{color:var(--dim);letter-spacing:4px;font-size:12px;text-transform:uppercase;margin-bottom:16px}
@media(max-width:760px){.cols,.wz{grid-template-columns:1fr}.fd{grid-template-columns:1fr}.poster{max-width:180px}.sum{position:static}.ts h1{font-size:32px}.stat{min-width:70px;padding:5px 9px}.stat b{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><div class="mark">🎬</div><div><div class="t1">Movie Studio Hero</div><div class="t2">by Universal Games</div></div></div>
    <div class="stats num">
      <div class="stat money"><span>Bank</span><b id="sMoney">$0</b></div>
      <div class="stat"><span>Date</span><b id="sDate">-</b></div>
      <div class="stat"><span>Reputation</span><b id="sRep">0</b></div>
      <div class="stat"><span>Fans</span><b id="sFans">0</b></div>
      <div class="stat"><span>Royalties/day</span><b id="sRoy">$0</b></div>
    </div>
  </header>
  <div class="sceneWrap"><canvas id="scene" width="320" height="170"></canvas></div>
  <div class="sceneBar">
    <div id="ticker">Welcome to Los Angeles…</div>
    <div class="speed" id="speed">
      <button type="button" data-speed="0">⏸</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-t="studio">🏠 Studio</button>
    <button type="button" class="tab" data-t="films">🎞️ Filmography</button>
    <button type="button" class="tab" data-t="upgrades">🛠️ Upgrades</button>
    <button type="button" class="tab" data-t="staff">👥 Staff</button>
    <button type="button" class="tab" data-t="log">📰 Trade News</button>
    <button type="button" class="tab" data-t="menu">⚙️ Menu</button>
  </nav>
  <main id="pane"></main>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>
<script>
(()=>{
'use strict';
// ===================== HELPERS =====================
const $=id=>document.getElementById(id);
const r=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>{if(!isFinite(n))n=0;const s=n<0?'-':'';n=Math.abs(n);
 const u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e4,'K']];for(const[v,l]of u)if(n>=v){const x=n/v;return s+'$'+(x>=100?x.toFixed(0):x.toFixed(1))+l}
 return s+'$'+Math.round(n).toLocaleString('en-US')};
const fmtN=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n)+'';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateStr=d=>`${MONTHS[Math.floor(d%360/30)]} ${d%30+1}, Year ${1+Math.floor(d/360)}`;
const stars=x=>{const s=Math.round(x*2)/2;return '★'.repeat(Math.floor(s))+(s%1?'½':'')};

// ===================== DATA (100% fictional) =====================
const TIERS=[
 {n:'Shoestring',c:400,days:8,off:0,d:'Borrowed camera, friends as crew, pizza as payment.'},
 {n:'Micro Indie',c:3000,days:12,off:0,d:'Rented gear and a scrappy two-week shoot.'},
 {n:'Indie Feature',c:40000,days:16,off:1,d:'A real crew and festival-circuit ambitions.'},
 {n:'Mid-Budget',c:600000,days:20,off:2,d:'Recognisable faces and proper trailers.'},
 {n:'Studio Picture',c:1e7,days:26,off:3,d:'Wide release in every multiplex in the country.'},

 Action:{good:['Teens','Young Adults','Everyone'],ok:['Adults'],bad:['Kids'],vfx:1,col:['#c0392b','#1a1a2e']},
 Comedy:{good:['Teens','Young Adults','Everyone'],ok:['Adults','Family'],bad:[],col:['#f39c12','#c0392b']},

 'Sci-Fi':{good:['Young Adults','Everyone'],ok:['Teens','Adults'],bad:['Kids'],vfx:1,col:['#1b6ca8','#0a0f2c']},
 Romance:{good:['Young Adults','Adults'],ok:['Teens'],bad:['Kids'],col:['#e75480','#5a1032']},

 Musical:{good:['Family','Everyone'],ok:['Adults','Kids'],bad:[],col:['#9b59b6','#f1c40f']},
 Western:{good:['Adults'],ok:['Everyone'],bad:['Kids','Teens'],col:['#d35400','#3e2412']},
 Documentary:{good:['Adults'],ok:['Young Adults'],bad:['Kids'],prestige:1,col:['#7f8c8d','#1c2326']},

 Mystery:{good:['Adults','Young Adults'],ok:['Teens','Everyone'],bad:['Kids'],col:['#283747','#6e2c00']},
 Crime:{good:['Adults'],ok:['Young Adults'],bad:['Kids','Family'],col:['#1c1c1c','#922b21']},
 Sports:{good:['Everyone','Teens'],ok:['Family','Young Adults','Adults'],bad:[],col:['#1e8449','#f4d03f']},
 War:{good:['Adults'],ok:['Young Adults'],bad:['Kids','Family'],vfx:1,prestige:1,col:['#4d5639','#1b1e14']}};

const AUD=['Kids','Family','Teens','Young Adults','Adults','Everyone'];
const AUD_D={Kids:'Under-10s and their patient parents.',Family:'Something for every generation.',Teens:'Loud, fast and endlessly shareable.','Young Adults':'Date nights and group outings.',Adults:'Mature themes and slow burns.',Everyone:'The elusive four-quadrant crowd-pleaser.'};

const SCRIPTS=[

 {n:'Prestige Playwright',f:.12,q:1.6,buzz:.95,award:.1,d:'Award-worthy dialogue. Critics swoon.'}];
const SUPS=[
 {n:'Local Unknowns',f:.005,q:0,buzz:1,d:'Enthusiastic, inexperienced, cheap.'},
 {n:'Character Actors',f:.03,q:.4,buzz:1,d:'Familiar faces who never miss a mark.'},

const LOCS=[

 {n:'Backlot Soundstage, Burbank',c:.1,good:['Comedy','Musical','Animation','Fantasy']},
 {n:'Downtown LA Streets',c:.15,good:['Action','Thriller','Crime','Drama']},

 {n:'Abandoned Asylum, Inland Empire',c:.1,good:['Horror','Mystery','Thriller']},
 {n:'Hillside Mansion, Los Feliz',c:.18,good:['Mystery','Drama','Romance']},
 {n:'Long Beach Docks',c:.14,good:['Crime','Action']},
 {n:'Griffith Park Trails',c:.12,good:['Sci-Fi','Documentary','Romance']},
 {n:'Pasadena Stadium',c:.2,good:['Sports','Musical','Drama']},
 {n:'Overseas Location Shoot',c:.5,good:['Fantasy','War','Documentary','Action']}];
const MUSIC=[

function makeReviews(f){const P=f.parts,list=Object.keys(P).sort((a,b)=>P[b]-P[a]),best=list[0],worst=list[list.length-1];
 const fill=s=>s.replace('{dir}',f.dir.replace(' (Self-Directed)','')).replace('{lead}',f.lead);
 const outs=[...OUTLETS].sort(()=>Math.random()-.5).slice(0,4);
 const reviews=outs.map(o=>{const sc=clamp(Math.round((f.critic+r(-10,10))/5)/2,.5,10);const s100=sc*10;
  const op=pick(OPEN.find(x=>s100>=x[0])[1]);
  let txt=op+' ';if(s100>=60)txt+=fill(pick(ASP[best].hi))+(s100<80&&Math.random()<.6?' '+fill(pick(ASP[worst].lo)):'');
  else{const hi=fill(pick(ASP[best].hi));txt+=fill(pick(ASP[worst].lo))+(Math.random()<.5?' Still, '+hi.charAt(0).toLowerCase()+hi.slice(1):'')}
  return{o,c:person(),s:sc,t:txt}});
 const band=f.audience>=70?'hi':f.audience>=45?'mid':'lo';
 const hs=[...HANDLES].sort(()=>Math.random()-.5);
 const audQ=[0,1,2].map(i=>({h:'@'+hs[i],s:clamp(Math.round((f.audience/20+r(-.8,.8))*2)/2,.5,5),t:pick(AUDQ[band])}));
 return{reviews,audQ}}
function weights(decay,n){const w=[];for(let i=0;i<n;i++)w.push(Math.pow(decay,i));const s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s)}
function release(p){const G=GENRES[p.genre],q=clamp(p.qBase+p.qMod,1,10);
 const critic=Math.round(clamp(q*10+(G.prestige?2:0)+r(-7,7),3,99));
 const audience=Math.round(clamp(q*7+p.parts.fit*1.5+p.star*4+(G.vfx?p.parts.craft*.8:0)+r(-8,8),5,99));
 const D=DIST.find(d=>d.k===p.dist),critW=D.critW||.4,score=critic*critW+audience*(1-critW);
 const reach=p.dist==='fest'?(critic>=70?1.3:.8):D.reach;
 const fanB=1+Math.log10(1+S.fans)/12,repB=1+S.rep/250,trend=S.trend===p.genre?1.25:1;
 let total,decay,weeks;
 if(p.dist==='stream'){total=p.prodCost*(1.1+score/100*.55)*r(.95,1.05);decay=.55;weeks=4}
 else{total=p.prodCost*(.5+Math.pow(score/100,2)*5)*p.mktM*p.winM*reach*p.buzz*trend*fanB*repB*(1+S.staff.mkt*.06)*p.ratingReach*r(.85,1.15);decay=clamp(.5+audience/100*.32,.5,.85);weeks=WEEKS}

 delete f.left;delete f.days;delete f.phase;

 log(`🍿 "${f.title}" premieres! Critics ${critic}% · Audiences ${audience}%. ${f.reviews[0].o}: "${f.reviews[0].t.split('.')[0]}."`,critic>=70?'g':critic<45?'r':'');
 toast(`🍿 "${f.title}" premieres – Critics ${critic}%, Audiences ${audience}%`,critic>=60?'g':'r');floatTxt('PREMIERE!','#f5c451');render()}
function closeRun(f){f.done=true;const roi=f.gross/f.cost,profit=f.gross-f.cost;
 let fg=Math.floor(Math.sqrt(f.gross)*((f.critic+f.audience)/2)/40*(1+S.staff.pub*.08));if(f.dist==='stream')fg=Math.floor(fg*.6);
 let v,amt=0,msg;
 if(roi>=4){v='SMASH';amt=Math.round(profit*.2);S.money+=amt;S.rep+=8;fg=Math.floor(fg*1.5);msg=`Smash hit! Merchandise & licensing deals pay a ${fmt(amt)} bonus. Reputation +8.`}
 else if(roi>=2){v='HIT';amt=Math.round(profit*.1);S.money+=amt;S.rep+=4;fg=Math.floor(fg*1.2);msg=`A hit! Investors pay a ${fmt(amt)} performance bonus. Reputation +4.`}
 else if(roi>=1){v='SOLID';S.rep+=1;msg='Turned a profit. Respectable work. Reputation +1.'}
 else if(roi>=.5){v='FLOP';amt=-Math.min(S.money,Math.round(f.cost*.15));S.money+=amt;S.rep-=5;fg=-Math.floor(S.fans*.05);msg=`A flop. Investors claw back ${fmt(-amt)}. Reputation −5 and some fans drift away.`}

 if(f.critic>=85&&Math.random()<.4+(f.awardBoost||0)){f.trophy=true;f.awardBonus=Math.round(f.gross*.05);S.money+=f.awardBonus;S.rep=clamp(S.rep+6,0,100);log(`🏆 "${f.title}" wins Best Picture at the Golden Reel Awards! Awards bump: ${fmt(f.awardBonus)}.`,'y')}

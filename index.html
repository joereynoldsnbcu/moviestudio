<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040b22">
<title>Movie Studio Hero – Universal Games</title>
<style>
:root{--bg:#040b22;--panel:#0b1738;--panel2:#10204a;--panel3:#17306a;--line:#20407f;--edge:#050a1c;--ink:#eef3ff;--dim:#9fb0d6;--gold:#f6c94c;--gold2:#d29b1c;--blue:#3d7eff;--sky:#7cc4ff;--silver:#d4dcef;--green:#4fd88a;--red:#ff5c6c;--orange:#ffa24a;--violet:#a78bfa;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Inter",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff5,transparent),radial-gradient(1px 1px at 88% 40%,#fff6,transparent),radial-gradient(1px 1px at 25% 70%,#fff4,transparent),radial-gradient(1px 1px at 60% 85%,#fff5,transparent),
 radial-gradient(1400px 700px at 50% -380px,#2a5bd7 0,#123a9a 28%,#0a1f5c 48%,transparent 70%),linear-gradient(180deg,#061133,#040b22 60%)}
h1,h2,h3,.logo,.tab,.btn,.chip,.stat b{font-family:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button,select{font:inherit;cursor:pointer;color:inherit}
#app{max-width:1150px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo .mark{width:54px;height:54px;flex:none;line-height:0}
.logo .mark svg{width:100%;height:100%}
.logo .t1{font-size:21px;font-weight:700;letter-spacing:.5px;line-height:1.1;color:#fff;text-shadow:0 2px 0 var(--edge)}
.logo .t2{font-size:11px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:5px 12px;display:flex;flex-direction:column;min-width:84px}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat b{font-size:16px;font-weight:600}
.stat.money b{color:var(--gold)}.stat.neg b{color:var(--red)}
.sceneWrap{position:relative;border-radius:8px;overflow:hidden;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line),0 10px 30px #000a;background:#000}
#scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:320/170}
.sceneBar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:2px solid var(--edge);border-top:none;border-radius:0 0 8px 8px;padding:8px 12px;margin-top:-2px}
#ticker{color:var(--dim);font-size:14px;flex:1;min-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;gap:0;border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.speed button{background:var(--panel2);border:0;border-right:2px solid var(--edge);padding:4px 11px;font-size:13px;color:var(--dim);font-weight:700}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--gold);color:#1d1400}
/* tabs */
.tabs{display:flex;gap:0;margin:14px 0 10px;background:var(--panel);border:2px solid var(--edge);border-radius:8px;overflow-x:auto}
.tab{background:none;border:0;border-right:1px solid #ffffff10;color:var(--dim);padding:10px 16px;font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
.tab:hover{color:var(--ink);background:#ffffff08}
.tab.on{background:var(--panel3);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
/* cards */
.card{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.card h3:before{content:"";width:8px;height:8px;flex:none;background:var(--gold);box-shadow:2px 2px 0 var(--edge)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dim{color:var(--dim)}.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.bl{color:var(--sky)}.o{color:var(--orange)}
.small{font-size:13px}
/* buttons: chunky handheld-style with a hard bottom edge */
.btn{position:relative;border:2px solid var(--edge);border-radius:6px;padding:8px 16px;font-weight:700;font-size:14px;letter-spacing:.3px;background:var(--gold);color:#241a00;
 box-shadow:inset 0 -3px 0 #0000002e,inset 0 2px 0 #ffffff59,0 3px 0 var(--edge);margin-bottom:3px;transition:filter .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 #00000026,inset 0 2px 0 #ffffff40,0 0 0 var(--edge)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.choice:focus-visible,.tab:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.btn:disabled{background:#26345e;color:#7383ad;box-shadow:inset 0 -3px 0 #0000002e,0 3px 0 var(--edge);cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:#1a2c5e;color:#e8eeff;box-shadow:inset 0 -3px 0 #0000003a,inset 0 2px 0 #ffffff1c,0 3px 0 var(--edge)}
.btn.blue{background:#3a6df0;color:#fff}
.btn.danger{background:#d9475a;color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:10px;background:#050c24;border-radius:3px;overflow:hidden;margin:8px 0 4px;border:2px solid var(--edge)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sky) 0 6px,#5fb0f5 6px 8px);transition:width .4s}
.bar.gold i{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#e3b33a 6px 8px)}
.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--silver);border:1px solid var(--edge)}
.pill.g{background:#123d2c;color:var(--green)}.pill.r{background:#4a1520;color:#ff8f9b}.pill.y{background:#4a3a0a;color:var(--gold)}
.vb{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.5px;border:2px solid var(--edge)}
.vb.SMASH{background:var(--gold);color:#241800}.vb.HIT{background:var(--green);color:#002312}.vb.SOLID{background:var(--sky);color:#001a33}
.vb.FLOP{background:var(--orange);color:#2a1300}.vb.BOMB{background:var(--red);color:#fff}.vb.RUN{background:var(--violet);color:#14093a}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #ffffff0d;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff08}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv>span:nth-child(odd){color:var(--dim)}
.upg{display:flex;flex-direction:column;gap:6px}.upg .ic{font-size:22px}
.lv{display:flex;gap:3px}.lv i{width:14px;height:8px;background:var(--panel3);border:1px solid var(--edge)}.lv i.on{background:var(--gold)}
#log .li{padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
#log .li .d{color:var(--dim);font-size:12px;margin-right:6px}
/* modal */
.modal{position:fixed;inset:0;background:#020617d8;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.mbox{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line),0 30px 80px #000c;border-radius:12px;max-width:960px;width:100%;max-height:94vh;overflow:auto;padding:20px}
.mbox h2{font-size:22px;margin-bottom:4px}
.hidden{display:none!important}
.wz{display:grid;grid-template-columns:1fr 250px;gap:16px}
.stepper{display:flex;gap:3px;margin:6px 0 14px;flex-wrap:wrap}
.stepper i{height:6px;flex:1;min-width:8px;background:var(--panel3);border:1px solid var(--edge)}
.stepper i.done{background:var(--sky)}.stepper i.cur{background:var(--gold)}
.opt{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 var(--edge);border-radius:8px;padding:11px 13px;margin-bottom:3px;text-align:left;font-size:14px;line-height:1.45}
.opt:hover{background:var(--panel3)}
.opt:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--edge)}
.opt.sel{background:#22336b;box-shadow:inset 0 0 0 2px var(--gold),0 3px 0 var(--edge)}
.opt:disabled{opacity:.4;cursor:not-allowed;transform:none}
.opt .ot{display:block;font-weight:700;font-size:15px;margin-bottom:3px;color:var(--ink)}
.opt.sel .ot:before{content:"▸ ";color:var(--gold)}
.opt .oc{display:block;margin-top:6px;color:var(--gold);font-weight:600}
.opt .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sum{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:12px;font-size:13px;align-self:start;position:sticky;top:0}
.sum .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #ffffff12}
.sum .tot{font-weight:700;font-size:15px;margin-top:6px;display:flex;justify-content:space-between}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;background:#050c24;color:var(--ink);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;width:100%;outline:none}
input[type=text]:focus,select:focus{box-shadow:inset 0 0 0 2px var(--gold)}
select{background:#050c24;color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:8px 10px;font-size:14px;width:100%}
input[type=color]{width:34px;height:30px;border:2px solid var(--edge);border-radius:6px;padding:0;background:none;cursor:pointer}
.fd{display:grid;grid-template-columns:180px 1fr;gap:18px}
.poster{aspect-ratio:2/3;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 10px 30px #0009;border:3px solid var(--edge)}
.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#ffffff35,transparent 45%),linear-gradient(180deg,transparent 40%,#000c)}
.poster b{position:relative;font-family:"Bahnschrift","Segoe UI",sans-serif;font-size:19px;line-height:1.1;text-transform:uppercase;letter-spacing:.5px}
.poster small{position:relative;color:#ffffffb0;font-size:11px;margin-top:4px}
.poster .aw{position:absolute;top:8px;right:8px;font-size:22px;z-index:1}
.poster .pl{position:absolute;top:8px;left:8px;width:36px;height:36px;z-index:1}
.scores{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:8px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;position:relative;border:2px solid var(--edge)}
.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:1}
.chart{display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 0;border-bottom:2px solid var(--line)}
.chart div{flex:1;background:var(--sky);border:2px solid var(--edge);border-bottom:0;min-height:2px;position:relative}
.chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.rev{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.rev .rh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.rev .rh b{font-size:13px}.rev .rs{font-weight:700}
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,460px);pointer-events:none}
.toast{background:#13265a;border:2px solid var(--edge);border-left:6px solid var(--gold);border-radius:6px;padding:9px 14px;font-size:14px;box-shadow:0 4px 0 var(--edge);animation:tin .2s steps(3)}
.toast.g{border-left-color:var(--green)}.toast.r{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:17px;color:var(--green);text-shadow:2px 2px 0 #000;animation:fl 1.5s forwards;z-index:40;font-family:"Bahnschrift","Segoe UI",sans-serif}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}
.ts{text-align:center;padding:6px}
.ts h1{font-size:40px;line-height:1.05;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #2350b8,0 6px 0 var(--edge);margin:8px 0}
.ts .by{color:var(--gold);letter-spacing:4px;font-size:12px;text-transform:uppercase;margin-bottom:14px}
/* editors */
.editor{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.preview{background:radial-gradient(circle at 50% 35%,#2a5bd7,#0a1a48 70%);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:0}
.preview canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.secs{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--edge);border-radius:6px;overflow:hidden;margin-bottom:14px}
.secs button{flex:1;background:var(--panel2);border:0;border-right:2px solid var(--edge);padding:7px 10px;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap}
.secs button:last-child{border-right:0}
.secs button.on{background:var(--gold);color:#241a00}
.fld{margin-bottom:12px}.fld>label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--panel2);border:2px solid var(--edge);border-radius:5px;padding:4px 9px;font-size:13px;font-weight:600;box-shadow:0 2px 0 var(--edge);margin-bottom:2px}
.chip:hover{background:var(--panel3)}
.chip.on{background:var(--gold);color:#241a00}
.sw{width:26px;height:26px;border-radius:5px;border:2px solid var(--edge);padding:0;box-shadow:0 2px 0 var(--edge)}
.sw.on{outline:2px solid var(--gold);outline-offset:1px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.presets button{background:var(--panel2);border:2px solid var(--edge);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;box-shadow:0 3px 0 var(--edge)}
.presets button:hover{background:var(--panel3)}
.decision{border-left:6px solid var(--orange)}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 var(--edge);border-radius:8px;padding:11px 14px;margin-top:9px}
.choice:hover{background:var(--panel3)}
.choice:hover b:before{content:"▸ ";color:var(--gold)}
.choice:active{transform:translateY(2px)}
.choice b{display:block;font-size:15px}
.assetRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0d;flex-wrap:wrap}
@media(max-width:760px){.cols,.cols2,.wz,.editor{grid-template-columns:1fr}.fd{grid-template-columns:1fr}.poster{max-width:180px}.sum,.preview{position:static}.ts h1{font-size:30px}.stat{min-width:70px;padding:5px 9px}.stat b{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="hdrLogo" title="Edit studio logo"><div class="mark" id="hdrMark"></div><div><div class="t1" id="hdrName">Movie Studio Hero</div><div class="t2">Movie Studio Hero · Universal Games</div></div></div>
    <div class="stats num">
      <div class="stat money" id="stMoney"><span>Bank</span><b id="sMoney">$0</b></div>
      <div class="stat"><span>Date</span><b id="sDate">-</b></div>
      <div class="stat"><span>Reputation</span><b id="sRep">0</b></div>
      <div class="stat"><span>Fans</span><b id="sFans">0</b></div>
      <div class="stat"><span>Net / day</span><b id="sNet">$0</b></div>
    </div>
  </header>
  <div class="sceneWrap"><canvas id="scene" width="320" height="170"></canvas></div>
  <div class="sceneBar">
    <div id="ticker">Welcome to Los Angeles…</div>
    <div class="speed" id="speed"><button type="button" data-speed="0" aria-label="Pause">II</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button></div>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-t="studio">Studio</button>
    <button type="button" class="tab" data-t="films">Films</button>
    <button type="button" class="tab" data-t="empire">Empire</button>
    <button type="button" class="tab" data-t="upgrades">Upgrades</button>
    <button type="button" class="tab" data-t="staff">Staff</button>
    <button type="button" class="tab" data-t="finance">Finance</button>
    <button type="button" class="tab" data-t="log">News</button>
    <button type="button" class="tab" data-t="menu">Menu</button>
  </nav>
  <main id="pane"></main>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>
<script>
(()=>{
'use strict';
// ===================== HELPERS =====================
const $=id=>document.getElementById(id);
const r=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(r(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>{if(!isFinite(n))n=0;const s=n<0?'-':'';n=Math.abs(n);
 const u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e4,'K']];for(const[v,l]of u)if(n>=v){const x=n/v;return s+'$'+(x>=100?x.toFixed(0):x.toFixed(1))+l}
 return s+'$'+Math.round(n).toLocaleString('en-US')};
const fmtN=n=>{const s=n<0?'-':'';n=Math.abs(n);return s+(n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n)+'')};
const pct=x=>Math.round(x*100)+'%';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateStr=d=>`${MONTHS[Math.floor(d%360/30)]} ${d%30+1}, Yr ${1+Math.floor(d/360)}`;
const stars=x=>{const s=Math.round(x*2)/2;return '★'.repeat(Math.floor(s))+(s%1?'½':'')};
const poss=n=>n.endsWith('s')?n+"'":n+"'s";
const tag=(t,c='')=>`<span class="pill ${c}">${t}</span>`;

// ===================== DATA (all fictional) =====================
const TIERS=[
 {n:'Shoestring',c:400,days:8,off:0,d:'Borrowed camera, friends as crew, pizza as payment.'},
 {n:'Micro Indie',c:3000,days:12,off:0,d:'Rented gear and a scrappy two-week shoot.'},
 {n:'Indie Feature',c:40000,days:16,off:1,d:'A real crew and festival-circuit ambitions.'},
 {n:'Mid-Budget',c:600000,days:20,off:2,d:'Recognisable faces and proper trailers.'},
 {n:'Studio Picture',c:1e7,days:26,off:3,d:'Wide release in every multiplex.'},
 {n:'Blockbuster',c:1.2e8,days:32,off:4,d:'Explosions. Lots of them. Worldwide release.'},
 {n:'Mega Tentpole',c:6e8,days:40,off:5,d:'A franchise-defining global event.'}];
const OFFICES=[
 {n:'Garage Studio, Reseda',c:0,cap:2,up:0,d:'Your mom says you can use it "for now".'},
 {n:'Strip-Mall Suite, Van Nuys',c:8000,cap:4,up:8,d:'Next to a donut shop. Perks!'},
 {n:'Backlot Bungalow, Burbank',c:150000,cap:7,up:120,d:'A real studio address.'},
 {n:'Soundstage Lot, Culver City',c:3e6,cap:10,up:2000,d:'Your own soundstages and screening room.'},
 {n:'Studio Campus, Universal Hills',c:6e7,cap:14,up:35000,d:'Palm-lined campus with a private theater.'},

function computeParts(ch,chem){const G=GENRES[ch.genre],e=S.equip,st=S.staff,vf=G.vfx?1:.25,ti=G.tones.indexOf(ch.tone.n);

function makeReviews(f){const P=f.parts,list=Object.keys(P).sort((a,b)=>P[b]-P[a]),best=list[0],worst=list[list.length-1];
 const fill=s=>s.replace('{dir}',f.dir.replace(' (You)','')).replace('{lead}',f.lead).replace('{co}',f.costar);
 const outs=[...OUTLETS].sort(()=>Math.random()-.5).slice(0,4);
 const reviews=outs.map(o=>{const sc=clamp(Math.round((f.critic+r(-10,10))/5)/2,.5,10);const s100=sc*10;
  let txt=pick(OPEN.find(x=>s100>=x[0])[1])+' ';
  if(s100>=60)txt+=fill(pick(ASP[best].hi))+(s100<80&&chance(.6)?' '+fill(pick(ASP[worst].lo)):'');
  else{const hi=fill(pick(ASP[best].hi));txt+=fill(pick(ASP[worst].lo))+(chance(.5)?' Still, '+hi.charAt(0).toLowerCase()+hi.slice(1):'')}
  if(f.addons.includes('food')&&chance(.4))txt+=' The burger tie-in feels shameless.';
  return{o,c:person(),s:sc,t:txt}});
 const band=f.audience>=70?'hi':f.audience>=45?'mid':'lo',hs=[...HANDLES].sort(()=>Math.random()-.5);
 const audQ=[0,1,2].map(i=>({h:'@'+hs[i],s:clamp(Math.round((f.audience/20+r(-.8,.8))*2)/2,.5,5),t:pick(AUDQ[band])}));
 return{reviews,audQ}}
function weights(decay,n){const w=[];for(let i=0;i<n;i++)w.push(Math.pow(decay,i));const s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s)}
function release(p){const G=GENRES[p.genre],q=clamp(p.qBase+p.qMod,1,10);
 const critic=Math.round(clamp(q*10+(G.prestige?2:0)+(p.addons.includes('premiere')?2:0)-(p.addons.includes('food')?3:0)+r(-7,7),3,99));
 const audience=Math.round(clamp(q*7+p.parts.fit*1.5+p.star*4+(G.vfx?p.parts.craft*.8:0)+S.equip.screen*1.2+r(-8,8),5,99));
 const D=DIST.find(d=>d.k===p.dist),critW=D.critW||.4,score=critic*critW+audience*(1-critW);
 const reach=p.dist==='fest'?(critic>=70?1.3:.8):p.dist==='platform'?(critic>=65?1.15:.7):D.reach;
 const fanB=1+Math.log10(1+S.fans)/12,repB=1+S.rep/250,trend=S.trend===p.genre?1.25:1;
 const ad=p.addons,kids=['Kids','Family'].includes(p.aud);
 let total,decay,weeks;
 if(p.dist==='stream'){total=p.prodCost*(1.1+score/100*.55)*(own('stream')?1.4:1)*r(.95,1.05);decay=.55;weeks=4}
 else{total=p.prodCost*(.5+Math.pow(score/100,2)*5)*p.mktM*p.winM*reach*p.buzz*trend*fanB*repB*(1+S.staff.mkt*.06)*p.ratingReach*p.intlM*p.compM
   *(own('cinema')&&p.dist==='wide'?1.1:1)*(ad.includes('bigtrailer')?1.12:1)*(ad.includes('food')&&kids?1.06:1)*(p.pirated?.85:1)*r(.85,1.15);
  decay=clamp(.5+audience/100*.32,.5,.85);weeks=WEEKS}
 const f=Object.assign({},p,{id:S.nextId++,q,critic,audience,total,decay,nWeeks:weeks,weeks:[],gross:0,done:false,dayInWeek:0,released:S.day,trendBoost:trend>1,tagline:pick(TAGS),anc:0});
 ['left','days','phase','tested'].forEach(k=>delete f[k]);
 Object.assign(f,makeReviews(f));S.films.push(f);S.prod=null;
 if(f.rebate>0){const reg=REGIONS[f.rebateReg];S.rebates.push({fid:f.id,title:f.title,amt:f.rebate,reg:f.rebateReg,due:S.day+Math.round(reg.days*(1-.08*S.staff.tax))});log(`${reg.n}: ${fmt(f.rebate)} rebate filed for "${f.title}".`)}
 log(`"${f.title}" premieres! Critics ${critic}% · Audiences ${audience}%.${f.comp?` Up against ${poss(f.comp.rival)} "${f.comp.title}".`:''}`,critic>=70?'g':critic<45?'r':'');
 toast(`"${f.title}" premieres – Critics ${critic}%, Audiences ${audience}%`,critic>=60?'g':'r');floatTxt('PREMIERE!','#f6c94c');render()}
function makeIP(f){if(f.ipId){const ip=S.ips.find(x=>x.id===f.ipId);if(ip){ip.fame=Math.min(200,ip.fame+fameOf(f)*.6);ip.films.push(f.id);return ip}}
 const ip={id:'ip'+f.id,name:f.title.replace(/\s+(\d+)$/,''),genre:f.genre,fame:fameOf(f),films:[f.id],born:S.day};S.ips.push(ip);f.ipId=ip.id;return ip}
function fameOf(f){return Math.round(((f.critic+f.audience)/2)*(.5+Math.min(1.5,Math.log10(f.gross+10)/8)))}
function closeRun(f){f.done=true;const roi=f.gross/f.cost,profit=f.gross-f.cost,prSoft=1-S.staff.pr*.1;
 let fg=Math.floor(Math.sqrt(f.gross)*((f.critic+f.audience)/2)/40*(1+S.staff.pub*.08));if(f.dist==='stream')fg=Math.floor(fg*.6);
 let v,amt=0,msg;
 if(roi>=4){v='SMASH';amt=Math.round(profit*.2);S.rep+=8;fg=Math.floor(fg*1.5);msg=`Smash hit! Licensing deals pay a ${fmt(amt)} bonus. Reputation +8.`}
 else if(roi>=2){v='HIT';amt=Math.round(profit*.1);S.rep+=4;fg=Math.floor(fg*1.2);msg=`A hit! Investors pay a ${fmt(amt)} performance bonus. Reputation +4.`}
 else if(roi>=1){v='SOLID';S.rep+=1;msg='Turned a profit. Respectable work. Reputation +1.'}
 else if(roi>=.5){v='FLOP';amt=-Math.round(f.cost*.15*prSoft);S.rep-=5*prSoft;fg=-Math.floor(S.fans*.05);msg=`A flop. Investors claw back ${fmt(-amt)}. Reputation −${Math.round(5*prSoft)}.`}
 else{v='BOMB';amt=-Math.round(f.cost*.3*prSoft);S.rep-=10*prSoft;fg=-Math.floor(S.fans*.12);msg=`Box-office bomb! Investors claw back ${fmt(-amt)}. Reputation −${Math.round(10*prSoft)}.`;
  const ks=Object.keys(S.staff).filter(k=>S.staff[k]>0);if(ks.length&&chance(.6*prSoft)){const k=pick(ks);S.staff[k]--;msg+=` A ${STAFF.find(s=>s.k===k).n} quits in embarrassment.`}}
 S.money+=amt;if(amt>0)S.stats.inc+=amt;
 let anc=0;if(f.album)anc+=f.gross*.02*(own('records')?1+own('records'):1);
 if(f.addons.includes('game')&&['Kids','Family','Teens'].includes(f.aud))anc+=f.gross*.03;
 if(anc>0){S.money+=anc;f.anc=anc;msg+=` Soundtrack & tie-ins earned ${fmt(anc)}.`}
 S.fans=Math.max(0,S.fans+fg);S.rep=clamp(S.rep,0,100);
 Object.assign(f,{verdict:v,bonus:amt,verdictMsg:msg,fanDelta:fg,roi});
 if((v==='HIT'||v==='SMASH'||f.audience>=78)&&f.gross>2000){const ip=makeIP(f);if(f.addons.includes('merch')){const m=f.gross*.04;S.money+=m;f.anc+=m;msg+=` Merch line adds ${fmt(m)}.`;f.verdictMsg=msg}log(`"${ip.name}" is now a studio IP (fame ${Math.round(ip.fame)}). Use it in parks, cruises and merch!`,'y')}
 if(f.critic>=85&&chance(.4+(f.awardBoost||0))){f.trophy=true;f.awardBonus=Math.round(f.gross*.05);S.money+=f.awardBonus;S.rep=clamp(S.rep+6,0,100);log(`"${f.title}" wins Best Picture at the Golden Reel Awards! Awards bump: ${fmt(f.awardBonus)}.`,'y')}
 if(f.gross>S.best)S.best=f.gross;
 log(`"${f.title}" closes with ${fmt(f.gross)} (${roi.toFixed(1)}× ROI) – ${v}. ${msg}`,roi>=1?'g':'r');
 if($('modal').classList.contains('hidden'))showFilm(f.id,true);else toast(`"${f.title}": ${v} – ${roi.toFixed(1)}× ROI`,roi>=1?'g':'r')}

const TICKET=[69,99,139],ATT=[1.2,1,.78];
const ipById=id=>S.ips.find(x=>x.id===id);
const fameF=id=>{const ip=ipById(id);return ip?ip.fame/100:0};
const season=()=>{const m=Math.floor(S.day%360/30);return(m>=5&&m<=7)||m===11?1.25:m<=1?.8:1};
function compIncome(k){const c=S.companies[k];if(!c)return 0;const C=COMPANIES.find(x=>x.k===k);let inc=C.c*C.inc*(1+.5*(c.lv-1));
 const fame=S.ips.reduce((a,ip)=>a+ip.fame,0);
 if(k==='toys')inc+=fame*40*c.lv;if(k==='games')inc+=fame*60*c.lv;if(k==='stream')inc+=S.films.filter(f=>f.done).length*30*c.lv;
 return inc}
function parkStats(p){const site=PARK_SITES.find(x=>x.k===p.site);if(S.day<p.closedUntil)return{vis:0,rev:0,up:site.c*.00025,site};
 const landB=p.lands.reduce((a,l)=>a+(.3+fameF(l.ip)*.5)*(1+.25*(l.lv-1)),0);
 const vis=Math.round(site.base*(site.home?1.1:1)*(1+landB)*ATT[p.price]*(p.sat/80)*season()*(.8+S.rep/250));
 const rev=vis*TICKET[p.price]*(1.5+p.hotel*.25);const up=site.c*.00025*(1+p.lands.length*.15+p.hotel*.1);return{vis,rev,up,site}}
function shipStats(s){const C=SHIPS.find(x=>x.k===s.cls),rt=ROUTES[s.route];if(S.day<s.docked)return{occ:0,rev:0,up:C.c*.0001,C};
 const occ=clamp(.55+(s.ip?fameF(s.ip)*.25:0)+S.rep/400+s.lv*.05+(s.sat-70)/300,.3,.98);const rev=C.pax*occ*220*rt.m*(1+s.lv*.1);return{occ,rev,up:rev*.45+C.c*.0001,C}}
function dailyFlows(){const roy=S.films.filter(f=>f.done).reduce((a,f)=>a+f.gross*.0015,0)*(own('stream')?2:1);
 let comp=0;for(const k in S.companies)comp+=compIncome(k);
 let park=0,parkUp=0;S.parks.forEach(p=>{const s=parkStats(p);park+=s.rev;parkUp+=s.up});
 let ship=0,shipUp=0;S.ships.forEach(s=>{const x=shipStats(s);ship+=x.rev;shipUp+=x.up});
 const sal=salary(),off=OFFICES[S.office].up,int=S.debt*.0005,od=S.money<0?-S.money*.002:0;
 const inc=roy+comp+park+ship,exp=sal+off+int+od+parkUp+shipUp;
 return{roy,comp,park,ship,parkUp,shipUp,sal,off,int,od,inc,exp,net:inc-exp}}
function netWorth(){let w=S.money-S.debt+OFFICES[S.office].c*.6;for(const k in S.companies){const C=COMPANIES.find(x=>x.k===k);w+=C.c*(1+.6*(S.companies[k].lv-1))*.8}
 S.parks.forEach(p=>w+=PARK_SITES.find(x=>x.k===p.site).c*.7);S.ships.forEach(s=>w+=SHIPS.find(x=>x.k===s.cls).c*.7);return w}
const loanCap=()=>Math.max(5000,Math.round(Math.max(0,netWorth())*.5+S.rep*500))-S.debt;

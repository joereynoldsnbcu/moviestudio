<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#333333">
<title>Movie Studio Hero – Universal Games</title>
<style>
:root{--bg:#333333;--panel:#0b1738;--panel2:#10204a;--panel3:#17306a;--line:#20407f;--edge:#050a1c;--ink:#eef3ff;--dim:#9fb0d6;--gold:#f6c94c;--gold2:#d29b1c;--blue:#3d7eff;--sky:#7cc4ff;--silver:#d4dcef;--green:#4fd88a;--red:#ff5c6c;--orange:#ffa24a;--violet:#a78bfa;--btn:#8fd3ff;--btnInk:#06213d;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Inter",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);min-height:100vh;background:var(--bg);overflow-x:hidden}
h1,h2,h3,.logo,.tab,.btn,.chip,.stat b{font-family:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button,select{font:inherit;cursor:pointer;color:inherit}
#app{max-width:1150px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo .mark{width:54px;height:54px;flex:none;line-height:0}
.logo .mark svg{width:100%;height:100%}
.logo .t1{font-size:21px;font-weight:700;letter-spacing:.5px;line-height:1.1;color:#fff;text-shadow:0 2px 0 #000}
.logo .t2{font-size:11px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:5px 12px;display:flex;flex-direction:column;min-width:84px}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat b{font-size:16px;font-weight:600}
.stat.money b{color:var(--gold)}.stat.neg b{color:var(--red)}
.sceneWrap{position:relative;border-radius:8px;overflow:hidden;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line),0 10px 30px #000a;background:#000;container-type:inline-size}
#scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:320/170}
.sign{position:absolute;left:22.5%;top:3.5%;width:38.75%;height:22.4%;display:flex;align-items:center;gap:3%;padding:0 4%;background:linear-gradient(180deg,#1b2d6e,#0f1c48);border:max(3px,.75cqw) dotted #ffd77a;outline:max(2px,.5cqw) solid #0a1230;border-radius:max(4px,.8cqw);animation:bulbs 1s steps(1) infinite;pointer-events:none}
@keyframes bulbs{50%{border-color:#c98a2a}}
.sign .sl{height:70%;aspect-ratio:1;flex:none;line-height:0}.sign .sl svg{width:100%;height:100%}
.sign .st{flex:1;min-width:0;text-align:center;line-height:1.1}
.sign .l1{display:block;font-family:"Bahnschrift","Segoe UI",sans-serif;font-weight:700;color:#ffd77a;letter-spacing:.18em;font-size:clamp(8px,1.55cqw,17px)}
.sign .l2{font-family:"Bahnschrift","Segoe UI",sans-serif;font-weight:800;color:#fff;text-transform:uppercase;font-size:clamp(11px,2.35cqw,27px);line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;text-shadow:0 .2cqw 0 #000}
.sign .l2.long{font-size:clamp(10px,1.9cqw,22px)}
@container (max-width:520px){.sign{left:20%;width:44%;height:26%;top:2.5%}.sign .sl{display:none}}
.sceneBar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:2px solid var(--edge);border-top:none;border-radius:0 0 8px 8px;padding:8px 12px;margin-top:-2px}
#ticker{color:var(--dim);font-size:14px;flex:1;min-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;gap:0;border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.speed button{background:var(--panel2);border:0;border-right:2px solid var(--edge);padding:4px 11px;font-size:13px;color:var(--dim);font-weight:700}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--btn);color:var(--btnInk)}
.tabs{display:flex;gap:0;margin:14px 0 10px;background:var(--panel);border:2px solid var(--edge);border-radius:8px;overflow-x:auto}
.tab{background:none;border:0;border-right:1px solid #ffffff10;color:var(--dim);padding:10px 15px;font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
.tab:hover{color:var(--ink);background:#ffffff08}
.tab.on{background:var(--panel3);color:#fff;box-shadow:inset 0 -3px 0 var(--btn)}
.card{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.card h3:before{content:"";width:8px;height:8px;flex:none;background:var(--btn);box-shadow:2px 2px 0 var(--edge)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dim{color:var(--dim)}.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.bl{color:var(--sky)}.o{color:var(--orange)}
.small{font-size:13px}
.btn{position:relative;border:2px solid var(--edge);border-radius:6px;padding:8px 16px;font-weight:700;font-size:14px;letter-spacing:.3px;background:var(--btn);color:var(--btnInk);
 box-shadow:inset 0 -3px 0 #0000002e,inset 0 2px 0 #ffffff70,0 3px 0 var(--edge);margin-bottom:3px;transition:filter .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 #00000026,inset 0 2px 0 #ffffff40,0 0 0 var(--edge)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.choice:focus-visible,.tab:focus-visible{outline:2px dashed var(--btn);outline-offset:2px}
.btn:disabled{background:#26345e;color:#7383ad;box-shadow:inset 0 -3px 0 #0000002e,0 3px 0 var(--edge);cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:#1a2c5e;color:#e8eeff;box-shadow:inset 0 -3px 0 #0000003a,inset 0 2px 0 #ffffff1c,0 3px 0 var(--edge)}
.btn.blue{background:#5fb8ff;color:var(--btnInk)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.danger{background:#d9475a;color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:10px;background:#050c24;border-radius:3px;overflow:hidden;margin:8px 0 4px;border:2px solid var(--edge)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sky) 0 6px,#5fb0f5 6px 8px);transition:width .4s}
.bar.gold i{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#e3b33a 6px 8px)}
.bar.vio i{background:repeating-linear-gradient(90deg,var(--violet) 0 6px,#8b6ff0 6px 8px)}
.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--silver);border:1px solid var(--edge)}
.pill.g{background:#123d2c;color:var(--green)}.pill.r{background:#4a1520;color:#ff8f9b}.pill.y{background:#4a3a0a;color:var(--gold)}
.vb{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.5px;border:2px solid var(--edge)}
.vb.SMASH{background:var(--gold);color:#241800}.vb.HIT{background:var(--green);color:#002312}.vb.SOLID{background:var(--sky);color:#001a33}
.vb.FLOP{background:var(--orange);color:#2a1300}.vb.BOMB{background:var(--red);color:#fff}.vb.RUN{background:var(--violet);color:#14093a}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #ffffff0d;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff08}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv>span:nth-child(odd){color:var(--dim)}
.upg{display:flex;flex-direction:column;gap:6px}.upg .ic{font-size:22px}
.lv{display:flex;gap:3px}.lv i{width:14px;height:8px;background:var(--panel3);border:1px solid var(--edge)}.lv i.on{background:var(--gold)}
#log .li{padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
#log .li .d{color:var(--dim);font-size:12px;margin-right:6px}
.modal{position:fixed;inset:0;background:#000000c8;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.mbox{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line),0 30px 80px #000c;border-radius:12px;max-width:960px;width:100%;max-height:94vh;overflow:auto;padding:20px}
.mbox h2{font-size:22px;margin-bottom:4px}
.hidden{display:none!important}
.wz{display:grid;grid-template-columns:1fr 250px;gap:16px}
.stepper{display:flex;gap:3px;margin:6px 0 14px;flex-wrap:wrap}
.stepper i{height:6px;flex:1;min-width:8px;background:var(--panel3);border:1px solid var(--edge)}
.stepper i.done{background:var(--sky)}.stepper i.cur{background:#fff}
.opt{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 var(--edge);border-radius:8px;padding:11px 13px;margin-bottom:3px;text-align:left;font-size:14px;line-height:1.45}
.opt:hover{background:var(--panel3)}
.opt:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--edge)}
.opt.sel{background:#1d3a75;box-shadow:inset 0 0 0 2px var(--btn),0 3px 0 var(--edge)}
.opt:disabled{opacity:.4;cursor:not-allowed;transform:none}
.opt .ot{display:block;font-weight:700;font-size:15px;margin-bottom:3px;color:var(--ink)}
.opt.sel .ot:before{content:"▸ ";color:var(--btn)}
.opt .oc{display:block;margin-top:6px;color:var(--gold);font-weight:600}
.opt .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sum{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:12px;font-size:13px;align-self:start;position:sticky;top:0}
.sum .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #ffffff12}
.sum .tot{font-weight:700;font-size:15px;margin-top:6px;display:flex;justify-content:space-between}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;background:#050c24;color:var(--ink);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;width:100%;outline:none}
input[type=text]:focus,select:focus{box-shadow:inset 0 0 0 2px var(--btn)}
select{background:#050c24;color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:8px 10px;font-size:14px;width:100%}
input[type=color]{width:34px;height:30px;border:2px solid var(--edge);border-radius:6px;padding:0;background:none;cursor:pointer}
.fd{display:grid;grid-template-columns:190px 1fr;gap:18px}
.posterbox{line-height:0}
.posterbox svg{width:100%;height:auto;border:3px solid var(--edge);border-radius:6px;box-shadow:0 10px 30px #0009}
.scores{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:8px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;position:relative;border:2px solid var(--edge)}
.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:1}
.chart{display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 0;border-bottom:2px solid var(--line)}
.chart div{flex:1;background:var(--sky);border:2px solid var(--edge);border-bottom:0;min-height:2px;position:relative}
.chart.vio div{background:var(--violet)}
.chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.rev{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.rev .rh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.rev .rh b{font-size:13px}.rev .rs{font-weight:700}
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,460px);pointer-events:none}
.toast{background:#13265a;border:2px solid var(--edge);border-left:6px solid var(--btn);border-radius:6px;padding:9px 14px;font-size:14px;box-shadow:0 4px 0 var(--edge);animation:tin .2s steps(3)}
.toast.g{border-left-color:var(--green)}.toast.r{border-left-color:var(--red)}.toast.y{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:17px;color:var(--green);text-shadow:2px 2px 0 #000;animation:fl 1.5s forwards;z-index:40;font-family:"Bahnschrift","Segoe UI",sans-serif}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}
.ts{text-align:center;padding:6px}
.ts h1{font-size:40px;line-height:1.05;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #2350b8,0 6px 0 var(--edge);margin:8px 0}
.ts .by{color:var(--gold);letter-spacing:4px;font-size:12px;text-transform:uppercase;margin-bottom:14px}
.editor{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.preview{background:radial-gradient(circle at 50% 35%,#2a5bd7,#0a1a48 70%);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:0}
.preview canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.preview #psPrev{line-height:0}.preview #psPrev svg{border:3px solid var(--edge);border-radius:6px;box-shadow:0 8px 20px #0008}
.secs{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--edge);border-radius:6px;overflow:hidden;margin-bottom:14px}
.secs button{flex:1;background:var(--panel2);border:0;border-right:2px solid var(--edge);padding:7px 10px;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap}
.secs button:last-child{border-right:0}
.secs button.on{background:var(--btn);color:var(--btnInk)}
.fld{margin-bottom:12px}.fld>label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--panel2);border:2px solid var(--edge);border-radius:5px;padding:4px 9px;font-size:13px;font-weight:600;box-shadow:0 2px 0 var(--edge);margin-bottom:2px}
.chip:hover{background:var(--panel3)}
.chip.on{background:var(--btn);color:var(--btnInk)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sw{width:26px;height:26px;border-radius:5px;border:2px solid var(--edge);padding:0;box-shadow:0 2px 0 var(--edge)}
.sw.on{outline:2px solid var(--btn);outline-offset:1px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.presets button{background:var(--panel2);border:2px solid var(--edge);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;box-shadow:0 3px 0 var(--edge)}
.presets button:hover{background:var(--panel3)}
.decision{border-left:6px solid var(--orange)}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 var(--edge);border-radius:8px;padding:11px 14px;margin-top:9px}
.choice:hover{background:var(--panel3)}
.choice:hover b:before{content:"▸ ";color:var(--btn)}
.choice:active{transform:translateY(2px)}
.choice b{display:block;font-size:15px}
.assetRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0d;flex-wrap:wrap}
.tut{max-width:680px;margin:0 auto}
.tutart{display:flex;justify-content:center;align-items:center;gap:16px;min-height:140px;background:radial-gradient(circle at 50% 40%,#2a5bd7,#0a1a48 72%);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;margin:10px 0 14px;padding:12px;flex-wrap:wrap;line-height:0}
.tutart .big{font-size:46px;line-height:1}
.tutart canvas{image-rendering:pixelated}
.tutart svg{border:2px solid var(--edge);border-radius:4px}
.tut ul{padding-left:20px;line-height:1.7;margin:6px 0}
.tutdots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.tutdots i{width:10px;height:10px;border:2px solid var(--edge);background:var(--panel3)}
.tutdots i.on{background:var(--btn)}
.mapwrap{background:#061029;border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;overflow:hidden;line-height:0}
.mapwrap svg{width:100%;height:auto;display:block}
.mk{cursor:pointer}.mk:hover{filter:brightness(1.35)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:2px solid var(--edge);display:inline-block}
.ach{display:flex;gap:10px;align-items:flex-start}
.ach .badge{width:38px;height:38px;flex:none;border:2px solid var(--edge);border-radius:8px;display:grid;place-items:center;font-size:18px;background:var(--panel3);box-shadow:0 2px 0 var(--edge)}
.ach.on .badge{background:var(--gold)}
.ach.off{opacity:.6}
/* awards show */
.mbox.awm{max-width:900px;background:#0a0612;padding:14px}
.awstage{position:relative;line-height:0;border:3px solid #3a2a08;box-shadow:0 0 0 2px #000,0 0 40px #f6c94c33;border-radius:8px;overflow:hidden;container-type:inline-size;background:#000}
.awstage canvas{width:100%;aspect-ratio:320/180;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.awtitle{position:absolute;left:0;right:0;top:3%;text-align:center;line-height:1.15;font-family:"Bahnschrift","Segoe UI",sans-serif;color:#ffd77a;font-weight:800;letter-spacing:.1em;font-size:clamp(13px,3cqw,28px);text-shadow:0 2px 0 #000,0 0 14px #000;pointer-events:none}
.awtitle small{display:block;color:#fff;font-size:.5em;letter-spacing:.25em;margin-top:.2em}
.awbig{position:absolute;left:4%;right:4%;bottom:6%;text-align:center;line-height:1.15;font-family:"Bahnschrift","Segoe UI",sans-serif;font-weight:800;color:#fff;font-size:clamp(15px,3.6cqw,34px);text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none}
.awbig.win{color:#ffd77a;animation:pop .5s steps(4)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.awpanel{margin-top:12px;background:#120a1c;border:2px solid #000;box-shadow:inset 0 0 0 1px #3a2a08;border-radius:8px;padding:14px}
.awpanel h3{color:#ffd77a}
.noms{list-style:none;display:grid;gap:6px;margin:8px 0}
.noms li{display:flex;justify-content:space-between;gap:10px;background:#1c1029;border:2px solid #000;border-radius:6px;padding:7px 10px;font-size:14px}
.noms li.you{border-color:#ffd77a;background:#2a1a08}
.noms li.won{background:#3a2a08;box-shadow:inset 0 0 0 2px #ffd77a}
/* park editor */
.parkmap{background:radial-gradient(circle at 50% 50%,#2f7d3a,#1d5428 75%);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;line-height:0;overflow:hidden}
.parkmap svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}.zone:hover path.zf{filter:brightness(1.18)}
.zone.sel path.zf{stroke:#fff;stroke-width:4}
.inv td{vertical-align:middle}
@media(max-width:760px){.cols,.cols2,.wz,.editor{grid-template-columns:1fr}.fd{grid-template-columns:1fr}.posterbox{max-width:190px}.sum,.preview{position:static}.ts h1{font-size:30px}.stat{min-width:70px;padding:5px 9px}.stat b{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="hdrLogo" title="Edit studio logo"><div class="mark" id="hdrMark"></div><div><div class="t1" id="hdrName">Movie Studio Hero</div><div class="t2">Movie Studio Hero · Universal Games</div></div></div>
    <div class="stats num">

function computeParts(ch,chem){const g=ch.genre,G=GENRES[g],e=S.equip,st=S.staff,vf=G.vfx?1:.25,ti=G.tones.indexOf(ch.tone.n),tie=tieOf(ch);
 const script=clamp(3+ch.script.q*2+ch.polish.q*2+st.writer*.35*(ch.script.writers?2:1)+(ch.script.pub&&own('publish')?.5:0)+(tie?.3:0)+r(-1,1),1,10);

 const acting=clamp(2+ch.lead.act*1.3+(ch.lead.spec===g?.8:0)+(hasPerk('school')&&ch.lead.note==='Unknown newcomer'?.5:0)+ch.costar.act*.5+(chem+(ch.polish.chem||0))*1.1+ch.sup.q*1.4+e.catering*.05+r(-1,1),1,10);
 const craft=clamp(2.5+(e.cam+e.snd+e.lit+e.edt)*.28+e.stage*.2+e.color*.15+e.drone*.25*(OUTDOOR.includes(g)?1:.3)+e.mocap*.3*(MOCAP.includes(g)?1:.1)+ch.music.q*1.2+ch.vfx.q*2*vf+(ch.vfx.n.startsWith('Outsource')&&own('vfxhouse')?.6*vf:0)+st.vfx*.3*vf+e.vfx*.25*vf+(own('anim')&&g==='Animation'?1:0)+(own('broadway')&&g==='Musical'?.6:0)+(ch.loc.good.includes(g)?1.2:ch.loc.c?.3:0)+ch.sched.q*.5+r(-1,1),1,10);
 const fit=clamp(5+(G.good.includes(ch.aud)?2.2:G.ok.includes(ch.aud)?.8:G.bad.includes(ch.aud)?-3:0)+ch.rating.fit[ch.aud]*1.4+((ch.rating.boost||[]).includes(g)?.8:0)+(ti===0?1.2:ti>0?.6:-1.5)+(ch.aud==='Everyone'?-.6:0)+(tie&&tie.genre===g?.5:0)+r(-.5,.5),1,10);
 return{script,direction,acting,craft,fit}}
function greenlight(){const ch=W.ch,C=costs(ch);if(C.t>S.money)return;
 ch.title=(($('wTitle')&&$('wTitle').value.trim())||ch.title||randTitle()).slice(0,40);
 const poster=Object.assign({},ch.poster||defPoster(ch.genre,ch.dist.k));delete poster.title;
 S.money-=C.t;S.stats.exp+=C.t;const t=TIERS[ch.tier],ci=W.tal.costars.indexOf(ch.costar),chem=W.chem[ci]||0,parts=computeParts(ch,chem),tie=tieOf(ch);
 let qBase=parts.script*.25+parts.direction*.25+parts.acting*.2+parts.craft*.15+parts.fit*.15;
 const last=S.films.slice(-3);if(last.filter(f=>f.genre===ch.genre).length>=2)qBase-=.6;
 if(ch.sequelOf)qBase-=.3;
 const days=Math.max(4,Math.ceil((t.days*ch.sched.days+ch.polish.days)*(hasPerk('jet')&&awayReg(ch.loc.reg)?.85:1)/(1+S.staff.prod*.12+S.equip.edt*.04)));
 const ad=ch.addons,yt=['Teens','Young Adults'].includes(ch.aud);
 const buzz=ch.script.buzz*ch.sup.buzz*(ch.music.buzz||1)*(ad.includes('premiere')?1.08:1)*(ad.includes('con')&&yt?1.1:1)*(ch.seqBuzz||1)*(tie?1+Math.min(.5,tie.fame/300):1)*(1+S.staff.pub*.03)*(1+ch.lead.star*.06+ch.costar.star*.03)*(own('mag')?1.05:1)*useHype();
 const rb=rebateInfo(ch,C.qual);
 S.prod={title:ch.title,tier:ch.tier,genre:ch.genre,tone:ch.tone.n,aud:ch.aud,rating:ch.rating.n,ratingReach:ch.rating.reach,script:ch.script.n+' · '+ch.polish.n,dir:ch.dir.n,dirEgo:ch.dir.ego,lead:ch.lead.n,leadRisk:ch.lead.risk,costar:ch.costar.n,coRisk:ch.costar.risk,chem,star:ch.lead.star,sup:ch.sup.n,
  loc:ch.loc.n,reg:ch.loc.reg,sched:ch.sched.n,music:ch.music.n,album:!!ch.music.album,vfx:ch.vfx.n,mkt:ch.mkt.n,mktM:ch.mkt.m*(own('tv')?1.2:1),addons:ad.slice(),dist:ch.dist.k,distN:ch.dist.n,intl:ch.intl.n,intlM:ch.intl.m*(hasPerk('global')&&ch.intl.m>1?1.1:1),piracy:ch.intl.piracy||0,win:ch.win.n,comp:ch.comp||null,compM:compMult(ch.comp,ch),
  winM:(ch.win.b[ch.genre]||1)*((ch.win.aud&&ch.win.aud[ch.aud])||1)*(ch.win.all||1),

  risk:(ch.script.risk?.3:0)+(ch.sup.risk?.2:0)+(ch.tone.risk?.3:0)+ch.lead.risk*.4,

  buzz,costL:C.L,cost:C.t,prodCost:C.qual,rebate:rb.amt,rebateReg:ch.loc.reg,parts,qBase,qMod:0,days,left:days,phase:'Pre-Production',events:[],sequelOf:ch.sequelOf||null,ipId:ch.ipId||(tie?tie.id:null),tested:false};
 log(`"${ch.title}" is greenlit! A ${t.n} ${ch.genre}${tie?` tied to ${tie.name}`:''} with a ${fmt(C.t)} budget.`,'y');
 toast(`"${ch.title}" greenlit!`,'g');closeModal();render()}

function makeReviews(f){const tv=f.kind==='show',P=f.parts,list=Object.keys(P).sort((a,b)=>P[b]-P[a]),best=list[0],worst=list[list.length-1];
 const A=tv?ASP_TV:ASP,OP=tv?OPEN_TV:OPEN,OUT=tv?OUTLETS_TV:OUTLETS,AQ=tv?AUDQ_TV:AUDQ,HN=tv?HANDLES_TV:HANDLES;
 const fill=s=>s.replace('{dir}',f.dir.replace(' (You)','')).replace('{lead}',f.lead).replace('{co}',f.costar);
 const outs=[...OUT].sort(()=>Math.random()-.5).slice(0,4);
 const reviews=outs.map(o=>{const sc=clamp(Math.round((f.critic+r(-10,10))/5)/2,.5,10);const s100=sc*10;
  let txt=pick(OP.find(x=>s100>=x[0])[1])+' ';
  if(s100>=60)txt+=fill(pick(A[best].hi))+(s100<80&&chance(.6)?' '+fill(pick(A[worst].lo)):'');
  else{const hi=fill(pick(A[best].hi));txt+=fill(pick(A[worst].lo))+(chance(.5)?' Still, '+hi.charAt(0).toLowerCase()+hi.slice(1):'')}
  if(tv){const fl=FMT_LINES[f.fmt],dl=DROP_LINES[f.drop];if(fl&&chance(.6))txt+=' '+fl[s100>=60?0:1];if(dl&&chance(.35))txt+=' '+dl[s100>=60?0:1];
   if(f.season>1&&chance(.4))txt+=s100>=60?` Season ${f.season} is even stronger than what came before.`:` Season ${f.season} has lost the spark of the original.`}
  else if((f.addons||[]).includes('food')&&chance(.4))txt+=' The burger tie-in feels shameless.';
  if(f.tieName&&chance(.35))txt+=s100>=60?` A worthy addition to the ${f.tieName} universe.`:` It trades on ${f.tieName} goodwill without earning it.`;
  return{o,c:person(),s:sc,t:txt}});
 const band=f.audience>=70?'hi':f.audience>=45?'mid':'lo',hs=[...HN].sort(()=>Math.random()-.5);
 const audQ=[0,1,2].map(i=>({h:'@'+hs[i],s:clamp(Math.round((f.audience/20+r(-.8,.8))*2)/2,.5,5),t:pick(AQ[band])}));
 return{reviews,audQ}}
const GROSS_KNEE=1.2e9,GROSS_CAP=3e9;
function capGross(raw,knee=GROSS_KNEE,cap=GROSS_CAP){if(raw<=knee)return raw;return knee+(cap-knee)*(1-Math.exp(-(raw-knee)/(cap-knee)))}
const frev=f=>f.rev!=null?f.rev:f.gross;
function weights(decay,n){const w=[];for(let i=0;i<n;i++)w.push(Math.pow(decay,i));const s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s)}
function release(p){const G=GENRES[p.genre],q=clamp(p.qBase+p.qMod,1,10);
 const critic=Math.round(clamp(q*10+(G.prestige?2:0)+(p.addons.includes('premiere')?2:0)-(p.addons.includes('food')?3:0)+S.equip.color*.5+r(-7,7),3,99));
 const audience=Math.round(clamp(q*7+p.parts.fit*1.5+p.star*4+(G.vfx?p.parts.craft*.8:0)+S.equip.screen*1.2+r(-8,8),5,99));
 const D=DIST.find(d=>d.k===p.dist),critW=D.critW||.4,score=critic*critW+audience*(1-critW);
 const reach=p.dist==='fest'?(critic>=70?1.3:.8):p.dist==='platform'?(critic>=65?1.15:.7):D.reach;
 const fanB=1+Math.log10(1+S.fans)/20,repB=1+S.rep/400,trend=S.trend===p.genre?1.15:1;
 const ad=p.addons,kids=['Kids','Family'].includes(p.aud);
 let total,decay,weeks,share,breakout=false;
 if(p.dist==='stream'){total=p.prodCost*(1.05+score/100*.4)*(own('stream')?1.25:1)*r(.95,1.05);decay=.55;weeks=4;share=1}
 else{// realistic theatrical model: quality drives the multiple, marketing/timing/reach modify it, worldwide gross is capped near $3B
  const base=.3+7*Math.pow(score/100,3);
  let ext=p.mktM*p.winM*reach*clamp(p.buzz,.7,1.6)*trend*fanB*repB*(1+S.staff.mkt*.03)*p.ratingReach*p.compM
   *(own('cinema')&&p.dist==='wide'?1.06:1)*(own('ticket')?1.03:1)*(ad.includes('bigtrailer')?1.08:1)*(ad.includes('food')&&kids?1.04:1)*(p.pirated?.85:1)*(hasPerk('analytics')?1.02:1);
  ext=clamp(ext,.25,2.6);
  if(p.tier<=3&&score>=72&&chance(.12)){ext*=1.8;breakout=true}
  total=capGross(p.prodCost*base*ext*p.intlM*r(.85,1.15));decay=clamp(.5+audience/100*.32,.5,.85);weeks=WEEKS;share=.5}
 const f=Object.assign({},p,{id:S.nextId++,kind:'film',q,critic,audience,total,decay,nWeeks:weeks,weeks:[],gross:0,rev:0,share,breakout,done:false,dayInWeek:0,released:S.day,trendBoost:trend>1,tagline:p.tagline||pick(TAGS),anc:0});
 ['left','days','phase','tested'].forEach(k=>delete f[k]);
 Object.assign(f,makeReviews(f));S.films.push(f);S.prod=null;
 if(f.rebate>0){const reg=REGIONS[f.rebateReg];S.rebates.push({fid:f.id,title:f.title,amt:f.rebate,reg:f.rebateReg,due:S.day+Math.round(reg.days*(1-.08*S.staff.tax))});log(`${reg.n}: ${fmt(f.rebate)} rebate filed for "${f.title}".`)}
 log(`"${f.title}" premieres! Critics ${critic}% · Audiences ${audience}%.${f.comp?` Up against ${poss(f.comp.rival)} "${f.comp.title}".`:''}`,critic>=70?'g':critic<45?'r':'');
 if(breakout)log(`"${f.title}" is a sleeper hit! Word of mouth is exploding.`,'g');toast(`"${f.title}" premieres – Critics ${critic}%, Audiences ${audience}%`,critic>=60?'g':'r');floatTxt('PREMIERE!','#f6c94c');render()}
function fameOf(f){return Math.round(((f.critic+f.audience)/2)*(.5+Math.min(1.5,Math.log10(f.gross+10)/8)))}
function makeIP(f,kind){if(f.ipId){const ip=S.ips.find(x=>x.id===f.ipId);if(ip){ip.fame=Math.min(200,ip.fame+fameOf(f)*.6);ip.films.push(f.id);return ip}}
 const nm=(kind==='tv'?f.baseTitle||f.title:f.title).replace(/\s+(\d+)$/,'');
 const ip={id:'ip'+f.id,name:nm,genre:f.genre,fame:fameOf(f),films:[f.id],born:S.day,kind:kind||'film'};S.ips.push(ip);f.ipId=ip.id;return ip}
const merchMult=()=>hasPerk('warehouse')?1.25:1;
const fanMult=()=>(hasPerk('fanclub')?1.2:1)*(own('podcast')?1.1:1);
function closeRun(f){f.done=true;const prSoft=1-S.staff.pr*.1;
 if(f.dist!=='stream'&&f.share<1){const post=Math.round(f.gross*.3*(1-(f.cofin||0)));f.post=post;f.rev=frev(f)+post;S.money+=post;S.stats.inc+=post;log(`"${f.title}" enters home entertainment, streaming & TV licensing windows: ${fmt(post)}.`,'g')}
 const roi=frev(f)/f.cost,profit=frev(f)-f.cost;
 let fg=Math.floor(Math.sqrt(f.gross)*((f.critic+f.audience)/2)/40*(1+S.staff.pub*.08)*fanMult());if(f.dist==='stream')fg=Math.floor(fg*.6);
 let v,amt=0,msg;
 if(roi>=3){v='SMASH';amt=Math.round(profit*.1);S.rep+=8;fg=Math.floor(fg*1.5);msg=`Smash hit! Licensing and merchandising partners pay a ${fmt(amt)} bonus. Reputation +8.`}
 else if(roi>=1.8){v='HIT';amt=Math.round(profit*.05);S.rep+=4;fg=Math.floor(fg*1.2);msg=`A hit! Investors pay a ${fmt(amt)} performance bonus. Reputation +4.`}
 else if(roi>=1){v='SOLID';S.rep+=1;msg='Turned a profit. Respectable work. Reputation +1.'}
 else if(roi>=.5){v='FLOP';amt=-Math.round(f.cost*.08*prSoft);S.rep-=5*prSoft;fg=-Math.floor(S.fans*.05);msg=`A flop. Investors claw back ${fmt(-amt)}. Reputation −${Math.round(5*prSoft)}.`}
 else{v='BOMB';amt=-Math.round(f.cost*.2*prSoft);S.rep-=10*prSoft;fg=-Math.floor(S.fans*.12);msg=`Box-office bomb! Investors claw back ${fmt(-amt)}. Reputation −${Math.round(10*prSoft)}.`;
  const ks=Object.keys(S.staff).filter(k=>S.staff[k]>0);if(ks.length&&chance(.6*prSoft)){const k=pick(ks);S.staff[k]--;msg+=` A ${STAFF.find(s=>s.k===k).n} quits in embarrassment.`}}
 S.money+=amt;if(amt>0)S.stats.inc+=amt;
 let anc=0;if(f.album)anc+=f.gross*.01*(own('records')?1+own('records')*.5:1);

 if(((v==='HIT'||v==='SMASH'||f.audience>=78)&&f.gross>2000)||(f.tieId&&v!=='BOMB')){const ip=makeIP(f,'film');if(f.addons.includes('merch')){const m=f.gross*.02*merchMult();S.money+=m;f.anc+=m;msg+=` Merch line adds ${fmt(m)}.`;f.verdictMsg=msg}log(f.tieId?`"${f.title}" grows the ${ip.name} franchise (fame ${Math.round(ip.fame)}).`:`"${ip.name}" is now a studio IP (fame ${Math.round(ip.fame)}). Use it in parks, cruises, TV and merch!`,'y')}
 if(f.gross>S.best)S.best=f.gross;
 log(`"${f.title}" closes with ${fmt(f.gross)} worldwide · studio revenue ${fmt(frev(f))} (${roi.toFixed(1)}× ROI) – ${v}. ${msg}`,roi>=1?'g':'r');
 if(nominate(f)){log(`"${f.title}" is nominated for ${f.nom.cat} at the Golden Reel Awards!`,'y');toast(`🏆 "${f.title}" is nominated for ${f.nom.cat}!`,'y')}

function trigger(def,ctx){S.pending={id:def.id,ctx:ctx||(def.ctx?def.ctx():{})};S.history.scandals++;showDecision()}
function findDef(id){return id==='test'?TESTSCREEN:id==='pilot'?TVPILOT:SCANDALS.find(s=>s.id===id)}
function showDecision(){const P=S.pending,def=findDef(P.id);if(!def){S.pending=null;return}modalKind='dec';
 const dd=c=>typeof c.d==='function'?c.d(P.ctx):c.d,prodDec=P.id==='test'||P.id==='pilot';
 $('mbox').innerHTML=`<div class="card decision" style="margin:0"><div class="dim small">${prodDec?'PRODUCTION DECISION':P.id==='merger'?'BOARDROOM – ACTION NEEDED':'BREAKING – ACTION NEEDED'}</div><h2>${def.t}</h2><p style="margin:8px 0 6px">${def.x(P.ctx)}</p><div class="dim small">Game paused until you decide. Bank: ${fmt(S.money)}${!prodDec&&hasPerk('insurance')?' · Production Insurance covers 25% of costs':''}</div>
 ${def.ch.map((c,i)=>`<button type="button" class="choice" data-c="${i}"><b>${c.t}</b><span class="dim small">${dd(c)}</span></button>`).join('')}</div>`;
 $('modal').classList.remove('hidden')}
function resolveDecision(i){const P=S.pending,def=findDef(P.id);if(!def)return;S.pending=null;
 insuring=hasPerk('insurance')&&P.id!=='test'&&P.id!=='pilot';let msg;try{msg=def.ch[i].f(P.ctx)}finally{insuring=false}
 log(`${def.t}: ${msg}`,/−|-\d|fails|lose|leak|worse|uglier|Storm damage|breakdown|collapses/i.test(msg)?'r':'');
 $('mbox').innerHTML=`<h2>${def.t}</h2><p style="margin:10px 0 16px">${esc(msg)}</p><div class="row"><span></span><button type="button" class="btn" data-c="ok">Continue</button></div>`;modalKind='decdone';updateHeader()}
function maybeScandal(){if(S.day<S.scandalCD||S.pending||!$('modal').classList.contains('hidden'))return;
 const base=.018*(1-S.staff.pr*.1)*(1-S.equip.sec*.05);if(!chance(base))return;
 const crewIds=['strike','accident','tabloid','director','tvwalk'];
 const opts=SCANDALS.map(s=>[s,s.w()*(crewIds.includes(s.id)?1-.1*S.equip.catering:1)]).filter(x=>x[1]>0);if(!opts.length)return;
 let tot=opts.reduce((a,x)=>a+x[1],0),rr=Math.random()*tot;for(const[s,w]of opts){rr-=w;if(rr<=0){S.scandalCD=S.day+ri(20,40);trigger(s);return}}}

function tickInvest(){INVEST.forEach(a=>{const v=S.inv[a.k];if(!v)return;S.inv[a.k]=Math.max(0,v*(1+a.mu+a.sig*gauss()))});
 S.ventures=S.ventures.filter(v=>{v.left--;if(v.left>0)return true;const rr=Math.random();const m=rr<.45?0:rr<.7?r(.5,1.5):rr<.9?r(2,4):r(6,15);const pay=Math.round(v.stake*m);S.money+=pay;S.stats.inc+=pay;
  log(m===0?`Startup ${v.n} folds. Your ${fmt(v.stake)} stake is lost.`:`Startup ${v.n} ${m>=2?'is acquired':'returns capital'}: your ${fmt(v.stake)} stake pays ${fmt(pay)} (${m.toFixed(1)}×).`,m>=1?'g':'r');
  toast(m===0?`${v.n} folded`:`${v.n} paid ${fmt(pay)}`,m>=1?'g':'r');return false})}

 else titleScreen()}catch(e){console.error(e);titleScreen()}
